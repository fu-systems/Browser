<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 800px; }
.outer { display: flex; width: 800px; height: 300px; }
.panel { display: flex; flex-direction: column; width: 200px; padding: 10px; border: 1px solid #ccc; }
.panel-header { display: block; width: 178px; height: 30px; padding: 5px; }
.panel-body { display: block; flex: 1; width: 178px; padding: 5px; }
.content { display: flex; flex: 1; flex-direction: column; padding: 10px; }
.content-row { display: flex; width: 100%; height: 60px; margin: 0 0 10px 0; }
.content-item { flex: 1; height: 60px; margin: 0 5px; padding: 10px; border: 1px solid #ddd; }
</style>
</head>
<body>
<div id="outer" class="outer">
  <div id="panel" class="panel">
    <div id="pheader" class="panel-header">Panel</div>
    <div id="pbody" class="panel-body">Body</div>
  </div>
  <div id="content" class="content">
    <div id="crow1" class="content-row">
      <div id="citem1" class="content-item">A</div>
      <div id="citem2" class="content-item">B</div>
    </div>
    <div id="crow2" class="content-row">
      <div id="citem3" class="content-item">C</div>
      <div id="citem4" class="content-item">D</div>
    </div>
  </div>
</div>
</body>
</html>
