<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 800px; }
/* Test various shorthand forms */
.m1 { display: block; width: 200px; height: 50px; margin: 10px; }
.m2 { display: block; width: 200px; height: 50px; margin: 10px 20px; }
.m3 { display: block; width: 200px; height: 50px; margin: 10px 20px 30px; }
.m4 { display: block; width: 200px; height: 50px; margin: 10px 20px 30px 40px; }
.p1 { display: block; width: 200px; height: 50px; padding: 15px; }
.p2 { display: block; width: 200px; height: 50px; padding: 10px 20px; }
.b1 { display: block; width: 200px; height: 50px; border: 2px solid #333; }
</style>
</head>
<body>
<div id="m1" class="m1">margin:10px</div>
<div id="m2" class="m2">margin:10px 20px</div>
<div id="m3" class="m3">margin:10px 20px 30px</div>
<div id="m4" class="m4">margin:10px 20px 30px 40px</div>
<div id="p1" class="p1">padding:15px</div>
<div id="p2" class="p2">padding:10px 20px</div>
<div id="b1" class="b1">border:2px solid</div>
</body>
</html>
