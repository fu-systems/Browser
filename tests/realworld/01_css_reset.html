<!DOCTYPE html>
<html>
<head>
<style>
/* Common CSS reset patterns */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { margin: 0; padding: 0; }
h1, h2, h3, p { margin: 0; padding: 0; }

body { width: 800px; }
.container { width: 600px; margin: 0 auto; padding: 20px; }
h1 { display: block; width: 560px; padding: 10px 20px; margin: 0 0 10px 0; }
p { display: block; width: 560px; padding: 5px 20px; }
</style>
</head>
<body>
<div id="container" class="container">
  <h1 id="heading">Page Title</h1>
  <p id="para">Content paragraph</p>
</div>
</body>
</html>
