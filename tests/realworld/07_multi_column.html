<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 800px; }
.row { display: flex; width: 800px; margin: 0 0 20px 0; }
.col-4 { width: 266px; padding: 10px; }
.col-6 { width: 400px; padding: 10px; }
.col-8 { width: 533px; padding: 10px; }
.box { display: block; width: 100%; height: 100px; padding: 10px; border: 1px solid #aaa; margin: 0 0 10px 0; }
</style>
</head>
<body>
<div id="row1" class="row">
  <div id="col1" class="col-6"><div id="box1" class="box">Half</div></div>
  <div id="col2" class="col-6"><div id="box2" class="box">Half</div></div>
</div>
<div id="row2" class="row">
  <div id="col3" class="col-4"><div id="box3" class="box">Third</div></div>
  <div id="col4" class="col-4"><div id="box4" class="box">Third</div></div>
  <div id="col5" class="col-4"><div id="box5" class="box">Third</div></div>
</div>
<div id="row3" class="row">
  <div id="col6" class="col-8"><div id="box6" class="box">Wide</div></div>
  <div id="col7" class="col-4"><div id="box7" class="box">Narrow</div></div>
</div>
</body>
</html>
