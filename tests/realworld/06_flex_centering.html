<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 800px; }
.hero { display: flex; flex-direction: column; width: 800px; height: 400px; padding: 20px; }
.hero-title { display: block; width: 400px; height: 48px; margin: 0 0 20px 0; }
.hero-subtitle { display: block; width: 600px; height: 24px; margin: 0 0 30px 0; }
.hero-btn { display: block; width: 200px; height: 50px; padding: 15px; }
</style>
</head>
<body>
<div id="hero" class="hero">
  <div id="htitle" class="hero-title">Welcome to Our Site</div>
  <div id="hsub" class="hero-subtitle">Building the future of the web</div>
  <div id="hbtn" class="hero-btn">Get Started</div>
</div>
</body>
</html>
