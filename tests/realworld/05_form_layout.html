<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 800px; }
.form { display: block; width: 400px; margin: 20px auto; padding: 30px; border: 1px solid #ccc; }
.form-group { display: block; width: 340px; margin: 0 0 15px 0; }
.label { display: block; width: 340px; height: 20px; margin: 0 0 5px 0; }
.input { display: block; width: 340px; height: 36px; padding: 8px 12px; border: 1px solid #999; }
.btn { display: block; width: 340px; height: 40px; padding: 10px; margin: 20px 0 0 0; }
</style>
</head>
<body>
<div id="form" class="form">
  <div id="group1" class="form-group">
    <div id="label1" class="label">Email</div>
    <div id="input1" class="input">user@example.com</div>
  </div>
  <div id="group2" class="form-group">
    <div id="label2" class="label">Password</div>
    <div id="input2" class="input">********</div>
  </div>
  <div id="btn" class="btn">Submit</div>
</div>
</body>
</html>
