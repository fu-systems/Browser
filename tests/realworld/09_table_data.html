<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 800px; }
table { display: table; width: 600px; margin: 20px auto; border-collapse: collapse; }
thead { display: table-header-group; }
tbody { display: table-row-group; }
tr { display: table-row; }
th { display: table-cell; padding: 10px; border-bottom-width: 2px; border-bottom-style: solid; border-bottom-color: #333; width: 200px; height: 40px; }
td { display: table-cell; padding: 10px; border-bottom-width: 1px; border-bottom-style: solid; border-bottom-color: #ddd; width: 200px; height: 36px; }
</style>
</head>
<body>
<table id="tbl">
  <thead id="thead">
    <tr id="hrow">
      <th id="th1">Name</th>
      <th id="th2">Role</th>
      <th id="th3">Status</th>
    </tr>
  </thead>
  <tbody id="tbody">
    <tr id="row1">
      <td id="td1">Alice</td>
      <td id="td2">Engineer</td>
      <td id="td3">Active</td>
    </tr>
    <tr id="row2">
      <td id="td4">Bob</td>
      <td id="td5">Designer</td>
      <td id="td6">Active</td>
    </tr>
  </tbody>
</table>
</body>
</html>
