<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 800px; }
.header { display: flex; width: 800px; height: 60px; padding: 10px 20px; background-color: #333; }
.logo { width: 120px; height: 40px; }
.nav { display: flex; flex-grow: 1; height: 40px; }
.nav-item { width: 80px; height: 40px; padding: 10px; margin: 0 5px; }
</style>
</head>
<body>
<div id="header" class="header">
  <div id="logo" class="logo">Logo</div>
  <div id="nav" class="nav">
    <div id="nav1" class="nav-item">Home</div>
    <div id="nav2" class="nav-item">About</div>
    <div id="nav3" class="nav-item">Contact</div>
  </div>
</div>
</body>
</html>
