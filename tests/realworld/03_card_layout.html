<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 800px; }
.grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; width: 800px; padding: 20px; }
.card { padding: 15px; border: 1px solid #ccc; }
.card-title { display: block; width: 100%; height: 24px; margin: 0 0 10px 0; }
.card-body { display: block; width: 100%; height: 60px; }
</style>
</head>
<body>
<div id="grid" class="grid">
  <div id="card1" class="card">
    <div id="title1" class="card-title">Card 1</div>
    <div id="body1" class="card-body">Description</div>
  </div>
  <div id="card2" class="card">
    <div id="title2" class="card-title">Card 2</div>
    <div id="body2" class="card-body">Description</div>
  </div>
  <div id="card3" class="card">
    <div id="title3" class="card-title">Card 3</div>
    <div id="body3" class="card-body">Description</div>
  </div>
</div>
</body>
</html>
