name: Build & Test Linux

on:
  push:
    branches: [ master, main, 'claude/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux (GCC, GTK3 + Cairo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libgtk-3-dev libcairo2-dev \
            libfreetype-dev libfontconfig1-dev \
            libssl-dev

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-O2 -Wall -Wextra -Werror=return-type"

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run render test
        run: |
          cd build
          ./pane_render_test

      - name: Run CLI smoke test
        run: |
          cd build
          ./pane_cli

      - name: Run layout tests
        run: |
          cd build
          ./pane_layout_test

      - name: Run edge-case tests
        run: |
          cd build
          ./pane_edge_test

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: pane-linux-x86_64
          path: |
            build/pane
            build/pane_cli
            build/pane_render_test
            build/pane_layout_test
            build/pane_edge_test
            build/pane_site_test

      - name: Upload render test output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-test-output
          path: build/render_test.png
