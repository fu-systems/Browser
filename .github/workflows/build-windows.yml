name: Build Windows EXE

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  # ── Cross-compile from Linux using MinGW ──────────────────────────
  mingw-cross-compile:
    name: MinGW Cross-Compile (Linux → Windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 cmake

      - name: Configure with CMake
        run: |
          mkdir -p build-mingw
          cd build-mingw
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=../cmake/win32-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O2"

      - name: Build
        run: cmake --build build-mingw --parallel $(nproc)

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: pane-windows-mingw-x86_64
          path: |
            build-mingw/pane.exe
            build-mingw/pane_cli.exe

  # ── Native Windows build with MSVC ────────────────────────────────
  msvc-native:
    name: MSVC Native (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure with CMake (MSVC)
        run: |
          mkdir build-win
          cd build-win
          cmake .. -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build-win --config Release --parallel

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: pane-windows-msvc-x86_64
          path: |
            build-win/Release/pane.exe
            build-win/Release/pane_cli.exe
